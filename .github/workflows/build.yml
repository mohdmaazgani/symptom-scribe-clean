name: Reusable - Build

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      package-manager:
        description: "'npm' or 'bun'"
        type: string
        default: 'npm'
      upload-artifact:
        description: 'Whether to upload the dist/ output as a workflow artifact'
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: 'Name of the uploaded build artifact (empty if upload-artifact was false)'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}

      - name: Build
        run: npm run build

      - name: Set artifact name
        id: artifact-name
        run: |
          if [ "${{ inputs.upload-artifact }}" = "true" ]; then
            echo "value=build-output-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          path: dist
          retention-days: 7
