name: Reusable - Validate Workflows

on:
  workflow_call: {}

jobs:
  validate-workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        # CHANGED: pinned to a specific version instead of :latest. Floating
        # tags are a supply-chain risk (image can change under us without a
        # code change to review). Bump this deliberately when needed.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color