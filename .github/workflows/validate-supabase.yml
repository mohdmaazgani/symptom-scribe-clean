name: Reusable - Validate Supabase

on:
  workflow_call: {}

jobs:
  validate-supabase:
    name: Validate Supabase changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check config.toml is valid TOML
        run: |
          # CHANGED: skip gracefully instead of erroring if config.toml isn't
          # present. This job is triggered by any change under supabase/**,
          # not specifically to config.toml, so its absence isn't a failure.
          if [ ! -f "supabase/config.toml" ]; then
            echo "No supabase/config.toml found in this change — skipping TOML validation."
            exit 0
          fi

          python3 - <<'PY'
          import sys
          try:
              import tomllib
          except ImportError:
              print("tomllib unavailable, skipping"); sys.exit(0)
          with open("supabase/config.toml", "rb") as f:
              tomllib.load(f)
          print("supabase/config.toml is valid TOML")
          PY